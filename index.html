<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the safe-area insets have something to report against,
         which is what keeps the header clear of the notch once installed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hush</title>
    <meta name="description" content="A classroom noise meter — a colourful dial that shows the room how loud it is." />

    <!-- Link previews. The image is the app's own cover shot, served from the directory
         that hosts it; crawlers need an absolute URL and will not follow a relative one. -->
    <meta property="og:title" content="Hush" />
    <meta property="og:description" content="A classroom noise meter — a colourful dial that shows the room how loud it is." />
    <meta property="og:site_name" content="Jake's Portfolio" />
    <meta property="og:image" content="https://portfolio-4b9fe.web.app/images/hush-cover.jpg" />
    <meta property="og:image:alt" content="Hush" />
    <meta property="og:url" content="https://portfolio-4b9fe.web.app/hush/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hush" />
    <meta name="twitter:description" content="A classroom noise meter — a colourful dial that shows the room how loud it is." />
    <meta name="twitter:image" content="https://portfolio-4b9fe.web.app/images/hush-cover.jpg" />
    <meta name="twitter:image:alt" content="Hush" />
    <link rel="canonical" href="https://portfolio-4b9fe.web.app/hush/" />


    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#fbf7f0" />

    <!-- iOS reads its own tags rather than the manifest, and ignores an SVG icon. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hush" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
